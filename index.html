<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <title>Question Answer App</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/fuse.js@6.4.6/dist/fuse.min.js"></script>
    <style>
        /* Make the Question Input sticky */
        #sticky {
            position: sticky;
            top: 0px; /* Adjust based on your preference */
            z-index: 10; /* Make sure it stays on top */
        }

        /* Style for the container */
        .main-content {
            padding-top: 0px; /* Space for the sticky input */
        }
    </style>
</head>
<body class="bg-gray-100 p-4">
    <div 
        class="max-w-lg mx-auto bg-white pt-4 pb-4 rounded-lg shadow-lg bg-blue-200">
        <!-- Language Selection -->
        <div class="flex items-center justify-end mb-4 pl-6 pr-6">
            <label 
                for="language" 
                id="languageLabel" 
                class="block font-medium text-gray-700 mr-4">
            </label>
            <select 
                id="language" 
                class="w-1/2 p-1 text-sm border border-gray-300 rounded-lg"
                >
                <option value="en">English</option>
                <option value="ru">Русский</option>
                <option value="it">Italiano</option>
                <option value="zh-CN">中文 (Simplified)</option>
                <option value="zh-TW">中文 (Traditional)</option>
                <option value="de">Deutsch</option>
                <option value="vi">Tiếng Việt</option>
                <option value="fr">Français</option>
                <option value="es">Español</option>
            </select>
        </div>
        
        <hr class="mb-2">
        
        <!-- Question Title and Show Images Button -->
        <div class="flex justify-between pl-6 pr-6">
            <h1 id="questionTitle" class="text-lg font-bold"></h1>
            
            <button id="loadImagesButton" class="flex text-white rounded bg-pink-100 p-.5">
                <svg xmlns="http://www.w3.org/2000/svg" 
                    fill="none" 
                    viewBox="0 0 24 24" 
                    stroke-width="1.5" 
                    stroke="black" 
                    class="w-8">
                    
                    <path 
                        stroke-linecap="round" 
                        stroke-linejoin="round" 
                        d="m2.25 15.75 5.159-5.159a2.25 2.25 0 0 1 3.182 0l5.159 5.159m-1.5-1.5 1.409-1.409a2.25 2.25 0 0 1 3.182 0l2.909 2.909m-18 3.75h16.5a1.5 1.5 0 0 0 1.5-1.5V6a1.5 1.5 0 0 0-1.5-1.5H3.75A1.5 1.5 0 0 0 2.25 6v12a1.5 1.5 0 0 0 1.5 1.5Zm10.5-11.25h.008v.008h-.008V8.25Zm.375 0a.375.375 0 1 1-.75 0 .375.375 0 0 1 .75 0Z" />
                </svg>
                <svg xmlns="http://www.w3.org/2000/svg" 
                    fill="none" 
                    viewBox="0 0 24 24" 
                    stroke-width="1.5" 
                    stroke="black" 
                    class="w-8">
                    <path 
                        stroke-linecap="round" 
                        stroke-linejoin="round" 
                        d="M9.879 7.519c1.171-1.025 3.071-1.025 4.242 0 1.172 1.025 1.172 2.687 0 3.712-.203.179-.43.326-.67.442-.745.361-1.45.999-1.45 1.827v.75M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Zm-9 5.25h.008v.008H12v-.008Z" />
                  </svg>
                  
            </button>
        </div>

        <div 
        id="sticky"
        class="w-full bg-blue-200 pb-4 pt-2 pl-4 pr-4 rounded shadow-lg border-2"
        
        >
        <!-- Question Input -->
        <input 
            id="questionInput" 
            type="text" 
            placeholder="Enter your question here..." 
            class="w-full p-2 pl-6 pr-6 rounded-full">
        
        <!-- Answer Display -->
        <div id="answer" class="bg-green-100 p-2 rounded-lg shadow-md grid grid-cols-2 gap-4 mt-2"></div>
        </div>

        <hr class="mt-3">
        <!-- Image Display Area -->
        <div id="imagesDisplay" class="p-4 grid grid-cols-2 sm:grid-cols-2 md:grid-cols-3 gap-4">
            <!-- Dynamically loaded images will appear here -->
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
