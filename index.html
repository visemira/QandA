<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <title>Question Answer App</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/fuse.js@6.4.6/dist/fuse.min.js"></script>
</head>
<body class="bg-gray-100 p-4">
    <div class="max-w-lg mx-auto bg-white p-4 rounded-lg shadow-lg">
        
        <!-- Language Selection -->
        <div class="flex items-center justify-end mb-4">
            <label for="language" id="languageLabel" class="block font-medium text-gray-700 mr-4"></label>
            <select id="language" class="w-1/2 p-1 text-sm border border-gray-300 rounded">
                <option value="en">English</option>
                <option value="ru">Русский</option>
                <option value="it">Italiano</option>
                <option value="zh-CH">中文 (Simplified)</option>
                <option value="zh-TW">中文 (Traditional)</option>
                <option value="de">Deutsch</option>
                <option value="vi">Tiếng Việt</option>
                <option value="fr">Français</option>
                <option value="es">Español</option>
            </select>
        </div>
        
        <hr class="mb-2">
        
        <!-- Question Title and Show Images Button -->
        <div class="flex justify-between mb-2">
            <h1 id="questionTitle" class="text-lg font-bold"></h1>
            <button id="loadImagesButton" class="bg-blue-600 text-white p-1 rounded">
                Show Images
            </button>
        </div>

        <!-- Question Input -->
        <input 
            id="questionInput" 
            type="text" 
            placeholder="Enter your question here..." 
            class="w-full p-2 border border-gray-300 rounded mb-4">
        
        <!-- Answer Display -->
        <div id="answer" class="bg-green-100 p-2 rounded-lg shadow-md grid grid-cols-2 gap-4 mt-1 mb-2"></div>

        <!-- Image Display Area -->
        <div id="imagesDisplay" class="mt-2 grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4">
            <!-- Dynamically loaded images will appear here -->
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
